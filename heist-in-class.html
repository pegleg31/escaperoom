<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Penmen Heist · SNHU AI Labs</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
:root{
  --ink-blue:#00244e; --gold:#fdb913; --heritage:#0a3370; --sky-blue:#009dea;
  --impact-blue:#00559a; --parchment:#f4f0ec; --soft-blue:#e6f0f7; --warm-brown:#a55b00;
  --panel-tint:#faf7f3; --white:#ffffff; --warm-black:#1d1c18; --line:#d9d2c7;
  --line-soft:#e2ddd5; --muted:#5b6b7c; --placeholder:#8b9bad; --dim-on-navy:#cfe0f2;
  --radius:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',Arial,sans-serif;background:var(--parchment);color:var(--warm-black);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--warm-black)}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--warm-brown)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.card.hero{border-top:3px solid var(--gold)}
.btn{border:none;border-radius:var(--radius);font-weight:700;font-size:13px;padding:9px 16px}
.btn-gold{background:var(--gold);color:var(--ink-blue)}
.btn-gold:hover{background:#e9a800}
.btn-navy{background:var(--ink-blue);color:var(--white)}
.btn-navy:hover{background:#001838}
.btn-ghost{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.35)}
.btn-ghost:hover{border-color:rgba(255,255,255,.7)}
.btn-line{background:var(--white);color:var(--impact-blue);border:1px solid var(--line)}
.btn-line:hover{background:var(--panel-tint)}
.linkish{background:none;border:none;font-size:12px;font-weight:600;text-decoration:underline;padding:4px}
.callout{background:var(--soft-blue);border-radius:var(--radius);padding:12px 14px;font-size:13px}
.callout .co-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--impact-blue);display:block;margin-bottom:4px}
.field{background:var(--panel-tint);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;width:100%}
.field::placeholder{color:var(--placeholder)}
textarea.field{resize:vertical;min-height:56px}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}

/* ---------- mode chooser ---------- */
.chooser{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.chooser h1{font-size:34px;font-weight:800;color:var(--ink-blue);margin:10px 0 6px}
.chooser .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.choose-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.choose-card{width:320px;border-radius:var(--radius);padding:26px 22px;text-align:left;border:1px solid var(--line)}
.choose-card h2{font-size:19px;font-weight:800;margin:12px 0 6px}
.choose-card p{font-size:13px}
.choose-card.stage-card{background:var(--ink-blue);color:var(--white);border-color:var(--ink-blue)}
.choose-card.stage-card:hover{background:#001838}
.choose-card.stage-card p{color:var(--dim-on-navy)}
.choose-card.stage-card .ico{color:var(--gold)}
.choose-card.board-card{background:var(--white);border-top:3px solid var(--gold)}
.choose-card.board-card:hover{background:var(--panel-tint)}
.choose-card.board-card h2{color:var(--ink-blue)}
.choose-card.board-card p{color:var(--muted)}
.choose-card.board-card .ico{color:var(--warm-brown)}
.topic-row{margin-top:26px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.topic-row select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white)}
.setup-link{margin-top:14px}

/* ---------- projector stage (Arena projector template — room-facing only) ---------- */
.stage{min-height:100vh;background:var(--ink-blue);color:var(--white);display:flex;flex-direction:column}
.stage .linkish{color:var(--dim-on-navy)}
.ceiling{background:var(--gold);color:var(--ink-blue);font-weight:800;text-align:center;padding:11px 26px;font-size:15px}
.st-head{padding:16px 34px;display:flex;align-items:center;gap:20px;border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.st-dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.st-dot{height:24px;border-radius:999px;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;border:none;background:transparent;padding:0}
.st-dot.cur{padding:0 14px;background:var(--gold);color:var(--ink-blue)}
.st-dot.done{width:24px;background:var(--sky-blue);color:var(--ink-blue)}
.st-dot.up{width:24px;border:1.5px solid rgba(255,255,255,.35);color:var(--dim-on-navy);opacity:.8}
.pill{display:flex;border:1px solid rgba(255,255,255,.32);border-radius:999px;overflow:hidden;flex:none}
.pill button{background:transparent;border:none;color:var(--dim-on-navy);font-size:12px;font-weight:700;padding:6px 13px;white-space:nowrap}
.pill button.on{background:var(--gold);color:var(--ink-blue)}
.st-clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:none;color:var(--gold)}
.st-clock.danger{color:#e5484d}
.board-clock.danger{color:#e5484d}
.st-progress{height:6px;background:rgba(255,255,255,.14);flex:none}
.st-progress>div{height:100%;background:var(--gold)}
.st-hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:44px 80px;position:relative;min-height:0}
.st-numeral{position:absolute;top:14px;left:70px;font-size:230px;line-height:1;font-weight:800;color:var(--heritage);z-index:0;user-select:none;pointer-events:none;font-variant-numeric:tabular-nums}
.st-hero-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:26px;max-width:1240px}
.st-eyebrow{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.incoming{display:flex;align-items:center;gap:8px;background:rgba(229,72,77,.16);border:1px solid #e5484d;border-radius:999px;padding:5px 13px;flex:none}
.incoming .pulse{width:8px;height:8px;border-radius:999px;background:#e5484d}
.incoming span:last-child{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ff8b8f}
.st-quote{margin:0;font-weight:800;letter-spacing:-.02em;color:var(--white);font-size:clamp(26px,3.1vw,46px);line-height:1.2}
.st-quote.inc{font-style:italic;font-size:clamp(24px,3vw,44px);line-height:1.24}
.st-word{background:var(--gold);color:var(--ink-blue);font-size:26px;font-weight:800;letter-spacing:.12em;padding:11px 24px;border-radius:var(--radius)}
.st-hint{font-size:15px;color:var(--dim-on-navy)}
.join-panel{background:var(--white);color:var(--warm-black);border-radius:var(--radius);padding:18px 20px;display:flex;gap:18px;align-items:center;max-width:560px}
.qr-slot{width:88px;height:88px;border:2px dashed var(--line);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--placeholder);text-align:center;flex:none}
.st-foot{border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);padding:20px 34px;display:flex;flex-direction:column;gap:14px;flex:none}
.st-foot-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.st-foot-head .lab{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.st-foot-head .note{font-size:12.5px;color:var(--dim-on-navy)}
.crew-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.crew-card{flex:1 1 210px;min-width:200px;max-width:300px;text-align:left;border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:8px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:var(--white)}
.crew-card.on{background:var(--gold);border-color:var(--gold);color:var(--ink-blue)}
.crew-card input{background:transparent;border:none;font-size:14px;font-weight:800;color:inherit;flex:1;min-width:0;padding:0}
.crew-card input:focus{outline:1px dashed currentColor}
.crew-pts{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--gold)}
.crew-card.on .crew-pts{color:var(--ink-blue)}
.crew-step{width:28px;height:28px;flex:none;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;cursor:pointer;
  border:1px solid rgba(255,255,255,.3);color:var(--white);background:transparent}
.crew-card.on .crew-step{border-color:rgba(0,36,78,.35);color:var(--ink-blue)}
.rec-chip{flex:none;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 9px;background:var(--gold);color:var(--ink-blue)}
.crew-card.on .rec-chip{background:var(--ink-blue);color:var(--gold)}
.add-crew{flex:none;align-self:center;background:transparent;color:var(--dim-on-navy);border:1px dashed rgba(255,255,255,.34);border-radius:var(--radius);padding:12px 16px;font-size:13px;font-weight:700;white-space:nowrap}
.add-crew:hover{color:var(--white);border-color:rgba(255,255,255,.7)}
.award-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.award-row .to{font-size:12px;color:var(--dim-on-navy);flex:none}
.award-btn{flex:none;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.3)}
.award-btn.hot{background:var(--gold);color:var(--ink-blue);border-color:var(--gold);font-weight:800}
.st-nav{flex:none;border-radius:var(--radius);padding:11px 20px;font-size:13.5px;font-weight:700;white-space:nowrap}
.st-nav.back{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.32)}
.st-nav.back:hover{border-color:rgba(255,255,255,.7)}
.st-nav.next{background:var(--gold);color:var(--ink-blue);border:none}
.st-nav[disabled]{opacity:.4;pointer-events:none}

/* ---------- participant workboard (Arena evidence-wall template) ---------- */
.wb{min-height:100vh;display:flex;flex-direction:column;background:var(--parchment)}
.wb-head{background:var(--ink-blue);color:var(--white);padding:10px 26px;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center}
.ai-mark{width:34px;height:34px;background:var(--gold);color:var(--ink-blue);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.wb-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.wb-title{font-size:15px;font-weight:800}
.wb-clock{font-size:44px;line-height:1;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:none}
.wb-clock.danger{color:#e5484d}
.wb-progress{height:6px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden;flex:none}
.wb-progress>div{height:100%;background:var(--gold)}
.wb-dots{display:flex;gap:7px;align-items:center;margin-top:2px;flex-wrap:wrap}
.wb-dot{height:20px;border-radius:999px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;border:none;padding:0;background:none;color:var(--white)}
.wb-dot.cur{padding:0 12px;background:var(--gold);color:var(--ink-blue);font-size:11px}
.wb-dot.done{width:20px;background:var(--sky-blue);color:var(--ink-blue);cursor:pointer}
.wb-dot.open{width:20px;border:1.5px solid rgba(255,255,255,.7);font-weight:700;cursor:pointer}
.wb-dot.locked{width:20px;border:1.5px solid rgba(255,255,255,.35);color:var(--dim-on-navy);opacity:.75;font-weight:700}
.strip{background:var(--soft-blue);color:var(--impact-blue);padding:9px 26px;font-size:13px;font-weight:600;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.strip .strip-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;flex:none}
.strip .strip-text{color:var(--warm-black);font-weight:400;font-style:italic}
.wb-body{display:grid;grid-template-columns:minmax(280px,330px) minmax(440px,1fr) minmax(340px,400px);align-items:stretch;flex:1;min-width:0}
.wb-col-l{padding:18px 20px;display:flex;flex-direction:column;gap:13px;border-right:1px solid var(--line)}
.wb-col-m{padding:18px 20px;display:flex;flex-direction:column;gap:13px;min-width:0}
.wb-col-r{padding:18px 20px;display:flex;flex-direction:column;gap:11px;background:#f6f3ef;border-left:1px solid var(--line);min-width:0}
.goal-card{background:var(--white);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--radius);padding:13px 15px}
.goal-tx{font-size:13.5px;line-height:1.55;font-weight:600;color:var(--warm-black);margin-top:5px}
.brief-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--warm-brown);margin-bottom:6px}
.brief-title{font-size:21px;font-weight:800;color:var(--ink-blue);margin:0 0 6px;line-height:1.15}
.brief-body{font-size:14px;line-height:1.6;color:#3d3a33;margin:0}
.step-row{display:flex;gap:12px;align-items:baseline}
.step-row .n{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--warm-brown);flex:none}
.step-row .tx{font-size:13.5px;line-height:1.5}
.step-row .tx b{color:var(--ink-blue)}
.step-row.em .tx{font-weight:600}
.roster{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:9px}
.mini-lab{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--warm-brown)}
.roster-row{display:flex;gap:10px;align-items:baseline}
.roster-row .rn{font-size:11.5px;font-weight:800;color:var(--ink-blue);width:92px;flex:none}
.roster-row .rd{font-size:12.5px;color:#3d3a33;line-height:1.45}
.factcard{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.map-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.map-chip{background:var(--panel-tint);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:4px 10px}
.fact-note{font-size:12px;color:#3d3a33;margin-top:10px;line-height:1.5}
.artifact{background:var(--white);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--radius);padding:16px 20px}
.tx-quote{background:var(--ink-blue);color:var(--white);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px;font-style:italic;line-height:1.6}
.tx-quote .lab{display:block;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;font-style:normal}
.artifact-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.artifact-head .brief-eyebrow{margin-bottom:0}
.artifact-kind{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--impact-blue);background:var(--soft-blue);border-radius:999px;padding:4px 10px;flex:none}
.artifact-lines{font-size:15px;line-height:1.8;font-style:italic;color:var(--warm-black)}
.artifact-lines.plain{font-style:normal;font-size:13.5px;line-height:1.75}
.cipher-block{margin-top:12px;background:var(--ink-blue);color:var(--gold);border-radius:var(--radius);padding:12px 16px;
  font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:18px;font-weight:700;letter-spacing:.14em;text-align:center;word-break:break-word}
.prompt-block{margin-top:12px;background:var(--ink-blue);color:var(--dim-on-navy);border-radius:var(--radius);padding:12px 14px;font-size:12px;line-height:1.7}
.copy-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.copy-note{font-size:11.5px;color:var(--muted);margin-top:8px}
.copy-row{display:flex;justify-content:flex-end;margin-top:8px}
.checkpoint{background:var(--soft-blue);border-radius:var(--radius);padding:12px 15px}
.checkpoint .lab{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--impact-blue);display:block;margin-bottom:6px}
.checkpoint .tx{font-size:14px;line-height:1.6;color:var(--warm-black)}
.hq-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.hq-row>*:only-child{grid-column:1/-1}
@media (max-width:1350px){.hq-row{grid-template-columns:1fr}}
.unlock-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.unlock-help{font-size:13px;color:#3d3a33;line-height:1.5}
.unlock-row{display:flex;gap:8px}
.unlock-row input{flex:1;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.err{color:var(--warm-brown);font-size:12.5px;font-weight:700}
.done-card{background:var(--ink-blue);color:var(--white);border-radius:var(--radius);padding:13px 15px}
.done-card .co-label{color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:6px}
.wb-board-head{display:flex;align-items:baseline;gap:8px}
.wb-board-head h3{font-size:17px;font-weight:800;color:var(--ink-blue);margin:0}
.wb-board-head .owner{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warm-brown)}
.cand{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;display:flex;flex-direction:column;gap:5px}
.cand.likely{border-top:3px solid var(--gold)}
.cand.cleared{opacity:.6}
.cand-head{display:flex;align-items:baseline;gap:8px}
.cand-name{font-size:13.5px;font-weight:800;color:var(--ink-blue)}
.stamp{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px;flex:none}
.cand-meta{font-size:12px;color:#3d3a33;line-height:1.45}
.cand-chips{display:flex;gap:5px}
.rchip{flex:1;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 4px;cursor:pointer;border:1px solid transparent}
.rchip.off{background:var(--white);color:var(--muted);border:1px solid var(--line)}
.leads-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.lead-row{display:flex;gap:8px;align-items:center}
.lead-row input{flex:1;min-width:0}
.srcchip{flex:none;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;cursor:pointer}
.srcchip.ai{background:var(--soft-blue);color:var(--impact-blue);border:1px solid var(--impact-blue)}
.srcchip.crew{background:var(--ink-blue);color:var(--white);border:1px solid var(--ink-blue)}
.add-lead{align-self:flex-start;background:transparent;border:1px dashed var(--line);color:var(--impact-blue);border-radius:var(--radius);padding:7px 12px;font-size:12px;font-weight:700}
.add-lead:hover{background:var(--soft-blue)}
.submit-card{background:var(--ink-blue);color:var(--white);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.submit-card .lab{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.submit-card input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:var(--white);border-radius:var(--radius);padding:10px 12px;font-size:13.5px}
.submit-card input::placeholder{color:rgba(255,255,255,.55)}
.submit-note{font-size:12px;color:var(--dim-on-navy);line-height:1.45}
.ref-q{font-size:13.5px;font-weight:600;margin:12px 0 5px}
.dossier{font-size:13px;margin-bottom:8px}
.dossier b{color:var(--ink-blue)}

/* ---------- faculty setup ---------- */
.setup{max-width:860px;margin:0 auto;padding:34px 22px}
.setup h1{font-size:28px;font-weight:800;color:var(--ink-blue);margin:8px 0 4px}
.setup .step-card{padding:18px;margin-top:16px}
.setup .step-card h2{font-size:16px;font-weight:800;color:var(--ink-blue);margin-bottom:10px}
.setup label{font-size:12px;font-weight:700;color:var(--warm-brown);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}

/* Custom faculty packs merge in from localStorage */
const CUSTOM_KEY = "snhu-heist-custom";
function loadCustomPacks(){
  try{ const c = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "{}");

function T(str, p){
  return str.replaceAll("{target}",p.target).replaceAll("{Target}",p.Target)

    .replaceAll("{thief}",p.thief).replaceAll("{gameDescriptor}",p.gameDescriptor)
    .replaceAll("{trueSuspectCaps}",p.trueSuspect.toUpperCase())
    .replaceAll("{trueSuspectDescriptor}",p.trueSuspectDescriptor)
    .replaceAll("{trueLocationDetail}",p.trueLocationDetail)
    .replaceAll("{decoy}",p.decoyLocation).replaceAll("{recoveryAward}",p.recoveryAward)
    .replaceAll("{theftScene}",p.theftScene);
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function pack(){ return PACKS[S.pack]; }

    lead: p.phaseLeads[i], roadmap: p.roadmap[i] }));
}
function save(){
  const {mode,pack:pk,timing,phase,wordRevealed,ceiling,boardPhase,unlockedUpTo,roomPhase,stageT,boardT,boards,teams,selected,taunt}=S;
  /* Storage can be blocked (managed browsers, strict private mode, iframes) — the session must keep running in memory regardless. */
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({mode,pack:pk,timing,phase,wordRevealed,ceiling,boardPhase,unlockedUpTo,roomPhase,stageT,boardT,boards,teams,selected,taunt})); }catch(e){}
}
function board(){ if(!S.boards[S.pack]) S.boards[S.pack]=defaultBoard(pack());
  const b=S.boards[S.pack]; if(b.suspects.length!==pack().suspects.length) S.boards[S.pack]=defaultBoard(pack());
  const bb=S.boards[S.pack];
  if(!bb.subs) bb.subs={};
  bb.leads.forEach(l=>{ if(l.src==="AI-sourced")l.src="AI"; if(l.src==="crew-sourced")l.src="Crew"; });
  return bb; }
function fmt(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }

const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("snhu-heist-room") : null;
if(bc) bc.onmessage = (e)=>{ if(e.data && typeof e.data.phase==="number"){

  if([40,50,75].includes(e.data.timing) && S.mode!=="stage") S.timing=e.data.timing; /* …and its timing */
  save(); if(S.mode==="board") render(); } };
function broadcast(){ if(bc) bc.postMessage({phase:S.phase, pack:S.pack, timing:S.timing}); }

setInterval(()=>{
  const t = S.mode==="stage" ? S.stageT : S.mode==="board" ? S.boardT : null;
  if(!t || !t.running) return;
  t.remaining--;
  if(t.remaining<=0){ t.remaining=0; t.running=false;
    if(S.mode==="stage" && !S.ceiling){ S.ceiling=true; render(); } }
  save();
  document.querySelectorAll(".js-clock").forEach(el=>{
    el.textContent=fmt(t.remaining);
    el.classList.toggle("danger", t.remaining<60); });
  document.querySelectorAll(".js-elapsed").forEach(el=>{
    const tot=+el.dataset.total||1;
    el.style.width=Math.min(100,Math.round(((tot-t.remaining)/tot)*100))+"%"; });
},1000);

  const orig=btn?btn.textContent:"";
  const done=()=>{ if(btn){ btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent=orig,1400); } };
  const fallback=()=>{ /* clipboard API denied — select-and-execCommand still works on most managed browsers */
    const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    if(ok) done(); else if(btn){ btn.textContent="Select & copy manually"; setTimeout(()=>btn.textContent=orig,2200); } };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(fallback);
  else fallback();
}

          <div class="fact-note">If a location is not on this list, it does not exist in this case.</div>
        </div>
      </div>
      <div class="wb-col-m">
        ${artifactCard(i)}
        <div class="checkpoint"><span class="lab">${esc(cfg.checkpoint.label)}</span><span class="tx">${esc(cfg.checkpoint.text)}</span></div>
        ${hqRow}
      </div>
      <div class="wb-col-r">
        <div class="wb-board-head"><h3>Detective board</h3><span class="owner">Board Keeper</span></div>
        ${cands}
        <div class="leads-card">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span class="mini-lab">Evidence log</span>
            <span style="margin-left:auto;font-size:11px;color:var(--muted)">Tag every entry</span></div>
          <div style="font-size:11.5px;color:var(--muted);line-height:1.45">This is your attribution trail — what the AI claimed vs. what your crew worked out. It's your proof for the +15 decoy bonus and what you show at the share-out.</div>
          <input class="field" placeholder="${esc(p.Target)}'s last known location…" value="${esc(b.lastKnown)}" oninput="App.lastKnown(this.value)">
          ${leads}
          <button class="add-lead" onclick="App.leadAdd()">Add evidence</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- faculty topic setup ---------- */
let FS={discipline:"",focus:"",grapple:"",constraints:"",paste:"",msg:null};
function packSchemaPrompt(){
  return `You are helping a faculty member re-theme "The Heist" — a fictional mystery race where student crews use an AI partner to solve clues while a facilitator-driven AI thief taunts them. Produce a complete "swap pack": ONLY the participant-facing wording for a new topic. You must NOT change any structure, timing, roles, or rules.

THE NEW TOPIC:
- Class / discipline: ${FS.discipline||"[fill in]"}
- Topic focus: ${FS.focus||"[fill in]"}
- What students should grapple with: ${FS.grapple||"[fill in]"}
- Constraints: ${FS.constraints||"none"}

Invent a fully fictional theft in this world: something beloved is stolen hours before a deadline event; four fictional suspects; a taunting thief persona. Everything must be fiction — no real people.

Return ONLY a JSON object (no code fences, no commentary) with EXACTLY these fields:
{
 "sessionLabel": "The ___ Heist — short public title",
 "tagline": "one-line hook",
 "thief": "the thief persona's stage name",
 "gameDescriptor": "e.g. 'campus mascot-heist game' — 3-6 words describing the game world",
 "targetName": "the stolen thing, full name",
 "Target": "short name, capitalized as used mid-sentence",
 "target": "same short name",
 "theftScene": "the location it was stolen from (must be in mapLocations)",
 "deadline": "the deadline event, e.g. 'tonight's exhibition opening'",
 "recoveryAward": "name of the recovery award, e.g. 'Petey Recovery'",
 "scenario": "3-4 sentence fictional dossier intro: what was stolen, from where, when, the deadline",
 "mapLocations": ["exactly 8 fictional locations; MUST include theftScene and trueLocation; MUST NOT include decoyLocation"],
 "suspects": [4 objects: {"name","descriptor","motive","dossier" (2-3 lively fictional sentences)}; EXACTLY 2 of them also have "clearedByClue1": true; EXACTLY 1 of the OTHER two has "isThief": true],
 "trueSuspect": "the thief's name",
 "trueSuspectDescriptor": "their descriptor",
 "trueLocation": "where the target is hidden (must be in mapLocations)",
 "trueLocationDetail": "the location with flourish, e.g. 'the COSTUME LOFT above the Blackbox Theater'",
 "decoyLocation": "a plausible-sounding location that does NOT exist on the map, e.g. 'the Old Clock Tower'",
 "roadmap": ["5 one-liners, one per phase: briefing / first clue / the decoy note / the final ID / the reveal"],
 "phaseLeads": ["5 one-sentence phase leads the facilitator's screen shows, in-world"],
 "transmissions": ["3 taunting thief messages (60-90 words each): opening taunt; 'I've moved it — careless readers end up in places that don't exist'; the final squeeze"],
 "revealBeat": "2-3 sentences resolving the mystery: names trueSuspect and trueLocation; the target is safe",
 "clue1Title": "Clue 1 — where it was found",
 "clue1Text": ["a 4-line rhyming riddle whose solution is an attribute that clears EXACTLY the 2 clearedByClue1 suspects and leaves the other 2"],
 "clue1FacKey": "facilitator answer key: the solution and which two suspects it clears",
 "clue2Title": "Clue 2 — the thief's note",
 "clue2Lines": ["4-6 taunting lines; the FIRST LETTERS of the lines must spell a word pointing at trueLocation (acrostic); include a hint like 'one little shift'"],
 "clue2Cipher": "a Caesar +1 encoding (every letter shifted forward by one, A→B) of 'MEET AT THE <DECOY LOCATION>' in caps",
 "clue2FacKey": "facilitator key: the surface decode (which names the decoy, NOT on the map) and the acrostic (which points at trueLocation)",
 "clue3Title": "Clue 3 — motive + means",
 "clue3Text": ["5-6 lines: an access-log or record fragment proving who could reach trueLocation at dawn, plus a signature flourish only the true thief would leave"],
 "clue3FacKey": "facilitator key: the solution and what rules out the other surviving suspect",
 "briefTitles": ["5 short punchy in-world titles for the workboard's brief column, one per phase"],
 "briefBodies": ["5 one-to-two-sentence in-world briefs, one per phase; phase 3's should note the note decodes cleanly — and that's the worry"]
}

CRITICAL RULES: decoyLocation must NOT appear in mapLocations (that mismatch IS the lesson). Verify your Caesar cipher letter by letter. Verify the acrostic spells its word. Never name any specific AI product anywhere.`;
}
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)||("topic-"+Date.now()); }
function validatePack(o){
  const req=["sessionLabel","tagline","thief","gameDescriptor","targetName","Target","target","theftScene","deadline","recoveryAward","scenario","mapLocations","suspects","trueSuspect","trueSuspectDescriptor","trueLocation","trueLocationDetail","decoyLocation","roadmap","phaseLeads","transmissions","revealBeat","clue1Title","clue1Text","clue1FacKey","clue2Title","clue2Lines","clue2Cipher","clue2FacKey","clue3Title","clue3Text","clue3FacKey","briefTitles","briefBodies"];
  const missing=req.filter(k=>o[k]===undefined||o[k]==="");
  if(missing.length) return "Missing fields: "+missing.join(", ");
  if(!Array.isArray(o.mapLocations)||o.mapLocations.length<6) return "mapLocations must be an array of ~8 locations.";
  if(!Array.isArray(o.suspects)||o.suspects.length!==4) return "suspects must be an array of exactly 4.";
  const cleared=o.suspects.filter(s=>s.clearedByClue1).length, thieves=o.suspects.filter(s=>s.isThief);
  if(cleared!==2) return "Exactly 2 suspects must have clearedByClue1: true (found "+cleared+").";
  if(thieves.length!==1) return "Exactly 1 suspect must have isThief: true.";
  if(thieves[0].clearedByClue1) return "The thief cannot be cleared by Clue 1.";
  const mapLower=o.mapLocations.map(l=>l.toLowerCase());
  const decoyCore=o.decoyLocation.toLowerCase().replace(/^the\s+/,"");
  if(mapLower.some(l=>l.includes(decoyCore)||decoyCore.includes(l))) return "decoyLocation must NOT appear in mapLocations — that mismatch is the whole lesson.";
  if(!mapLower.some(l=>l===o.trueLocation.toLowerCase())) return "trueLocation must be one of mapLocations.";
  if(o.roadmap.length!==5||o.phaseLeads.length!==5) return "roadmap and phaseLeads must each have 5 entries.";
  if(o.transmissions.length!==3) return "transmissions must have 3 entries.";
  if(!Array.isArray(o.briefTitles)||o.briefTitles.length!==5||!Array.isArray(o.briefBodies)||o.briefBodies.length!==5) return "briefTitles and briefBodies must each have 5 entries.";
  return null;
}
function renderSetup(){
  return `<div class="setup">
    <div class="eyebrow">SNHU AI Labs · Challenge · Faculty setup</div>
    <h1>Add your own topic</h1>
    <p style="font-size:13.5px;color:var(--muted)">Three steps: describe your class, run the generated prompt in your AI tool of choice, paste the result back. The engine, timing, roles, and rules never change — only the story.</p>
    <div class="card hero step-card"><h2>Step 1 — Your class</h2>
      <label>Class / discipline</label><input class="field" value="${esc(FS.discipline)}" oninput="App.fs('discipline',this.value)" placeholder="e.g. Intro to Criminal Justice">
      <label>Topic focus</label><input class="field" value="${esc(FS.focus)}" oninput="App.fs('focus',this.value)" placeholder="e.g. chain of custody and evidence handling">
      <label>What should students grapple with?</label><input class="field" value="${esc(FS.grapple)}" oninput="App.fs('grapple',this.value)" placeholder="e.g. verifying confident claims before acting on them">
      <label>Constraints (optional)</label><input class="field" value="${esc(FS.constraints)}" oninput="App.fs('constraints',this.value)" placeholder="e.g. keep it lighthearted; no crime-scene gore"></div>
    <div class="card step-card"><h2>Step 2 — Run this prompt in your AI tool</h2>
      <div class="gen-prompt" id="genPrompt">${esc(packSchemaPrompt())}</div>
      <div class="copy-row"><button class="btn btn-navy" onclick="App.copySetup(this)">Copy prompt</button></div></div>
    <div class="card step-card"><h2>Step 3 — Paste the JSON it returns</h2>
      <textarea class="field" style="min-height:120px" placeholder='Paste the JSON swap pack here…' oninput="App.fs('paste',this.value)">${esc(FS.paste)}</textarea>
      <div style="display:flex;gap:10px;margin-top:10px;align-items:center">
        <button class="btn btn-gold" onclick="App.validateSetup()">Validate &amp; save topic</button>
        ${FS.msg?`<span class="${FS.msg.ok?"ok":"err"}" style="margin:0">${esc(FS.msg.text)}</span>`:""}</div></div>
    ${Object.keys(CUSTOM).length?`<div class="card step-card"><h2>Saved topics</h2>
      ${Object.keys(CUSTOM).map(k=>`<div class="saved-topic"><b>${esc(CUSTOM[k].sessionLabel)}</b><span style="color:var(--muted)">(${k})</span>
        <span style="flex:1"></span><button class="btn btn-line" onclick="App.removeTopic('${k}')">Remove</button></div>`).join("")}</div>`:""}
    <div class="card step-card"><h2>Facilitator only — the thief prompt</h2>
      <p style="font-size:13px;color:var(--muted)">The projector stays room-safe, so the villain lives in <em>your</em> AI tool. Copy the prompt for your topic and paste it into your own chat before class. It contains the solution — never show students.</p>
      <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <select id="thiefTopic" style="padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white)">
          ${Object.keys(PACKS).map(k=>`<option value="${k}" ${k===S.pack?"selected":""}>${esc(PACKS[k].sessionLabel)}</option>`).join("")}</select>
        <button class="btn btn-navy" onclick="App.copyThief(this)">Copy thief prompt</button>
      </div></div>
    <div style="margin-top:18px"><button class="linkish" style="color:var(--impact-blue)" onclick="App.setMode(null)">← Back to the mode chooser</button></div>
  </div>`;
}

/* ---------- app wiring ---------- */
function render(){
  const app=document.getElementById("app");
  app.innerHTML = S.mode==="stage"?renderStage():S.mode==="board"?renderBoard():S.mode==="setup"?renderSetup():renderChooser();
}
const App={
  setMode(m){ S.mode=m; save(); render(); },
  setPack(k){ S.pack=k; S.phase=0; S.boardPhase=0; S.unlockedUpTo=REQUIRE_WORDS?0:PHASE_META.length-1; S.wordRevealed=false; S.ceiling=false;
    S.stageT={remaining:phases()[0].mins*60,running:false}; S.boardT={remaining:phases()[0].mins*60,running:false}; save(); render(); },
  setTiming(t){ S.timing=t;
    S.stageT.remaining=phases()[S.phase].mins*60; S.stageT.running=false;
    S.boardT.remaining=phases()[S.boardPhase].mins*60; S.boardT.running=false; save(); render(); },
  toggleRun(){ const t=S.mode==="stage"?S.stageT:S.boardT; t.running=!t.running; save(); render(); },
  resetTimer(){ const t=S.mode==="stage"?S.stageT:S.boardT;
    t.remaining=phases()[S.mode==="stage"?S.phase:S.boardPhase].mins*60; t.running=false; S.ceiling=false; save(); render(); },
  reveal(){ S.wordRevealed=true; save(); render(); },
  goPhase(i){ if(i<0||i>=PHASE_META.length) return;
    S.phase=i; S.wordRevealed=false; S.ceiling=false; S.taunt="";
    S.stageT={remaining:phases()[i].mins*60,running:false}; broadcast(); save(); render(); },
  blastTaunt(){ const el=document.getElementById("stTaunt");
    if(el&&el.value.trim()){ S.taunt=el.value.trim(); save(); render(); } },
  clearTaunt(){ S.taunt=""; save(); render(); },
  boardReset(){ if(!confirm("Start fresh? This relocks phases 2–5 and clears this crew's board for the current topic.")) return;
    S.boardPhase=0; S.unlockedUpTo=REQUIRE_WORDS?0:PHASE_META.length-1; S.roomPhase=0;
    S.boards[S.pack]=defaultBoard(pack());
    S.boardT={remaining:phases()[0].mins*60,running:false}; save(); render(); },
  stageReset(){ if(!confirm("New session? This clears all crews and scores and returns to Phase 1.")) return;
    S.phase=0; S.wordRevealed=false; S.ceiling=false; S.taunt=""; S.teams=[]; S.selected=0;
    S.stageT={remaining:phases()[0].mins*60,running:false}; broadcast(); save(); render(); },
  addTeam(){ if(S.teams.length<8){ S.teams.push({name:"Crew "+(S.teams.length+1),pts:0,rec:false,crown:false}); save(); render(); } },
  teamName(i,v){ S.teams[i].name=v; save(); },
  teamPts(i,d){ S.teams[i].pts=Math.max(0,S.teams[i].pts+d); save(); render(); },
  selCrew(i){ S.selected=i; save(); render(); },
  award(n){ const a=AWARD_BTNS[n], i=Math.min(S.selected||0,S.teams.length-1), t=S.teams[i];
    if(!t||!a) return;
    t.pts+=a.pts;
    if(a.recovery && !t.rec){ t.crown=!S.teams.some(x=>x.rec); t.rec=true; }
    save(); render(); },
  wordIn(v){ wordInput=v; if(wordError){wordError=false; render();} },
  tryUnlock(){ const next=S.unlockedUpTo+1;
    if(next>=PHASE_META.length) return;
    if(wordInput.trim().toUpperCase()===PHASE_META[next].word){
      S.unlockedUpTo=next; S.boardPhase=next; wordInput=""; wordError=false;
      S.boardT={remaining:phases()[next].mins*60,running:false}; save(); render();
    } else { wordError=true; render(); } },
  boardGo(i){ if(i<=S.unlockedUpTo){ S.boardPhase=i; S.boardT={remaining:phases()[i].mins*60,running:false}; save(); render(); } },
  susSet(i,v){ board().suspects[i]=v; save(); render(); },
  lastKnown(v){ board().lastKnown=v; save(); },
  leadT(i,v){ board().leads[i].t=v; save(); },
  leadToggle(i){ const l=board().leads[i]; l.src=l.src==="AI"?"Crew":"AI"; save(); render(); },
  leadAdd(){ board().leads.push({t:"",src:"Crew"}); save(); render(); },
  subAnswer(v){ const b=board(); b.subs[S.boardPhase]=Object.assign(b.subs[S.boardPhase]||{},{answer:v}); save(); },
  subSend(){ const b=board(); const s=b.subs[S.boardPhase]=b.subs[S.boardPhase]||{};
    s.submitted=true; s.lockedAt=fmt(S.boardT.remaining); save(); render(); },
  refl(i,v){ board().reflections[i]=v; save(); },
  verify(v){ board().verifyLine=v; save(); },
  stem(v){ board().stemLine=v; save(); },
  copyThief(b){ const el=document.getElementById("thiefTopic");
    const k=el&&PACKS[el.value]?el.value:S.pack;
    copyText(T(THIEF_PROMPT_TPL,PACKS[k]),b); },
  copyArtifact(b){ copyText(artifactText(S.boardPhase),b); },
  copyCase(b){ copyText(caseFileText(),b); },
  copyPrime(b){ copyText(PRIME_PROMPT,b); },
  copySetup(b){ copyText(packSchemaPrompt(),b); },
  fs(k,v){ FS[k]=v; if(k!=="paste"){ const el=document.getElementById("genPrompt"); if(el) el.textContent=packSchemaPrompt(); } },
  validateSetup(){
    let raw=FS.paste.trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
    let obj; try{ obj=JSON.parse(raw); }catch(e){ FS.msg={ok:false,text:"That isn't valid JSON — paste exactly what your AI tool returned."}; render(); return; }
    const err=validatePack(obj);
    if(err){ FS.msg={ok:false,text:err}; render(); return; }
    const key=slugify(obj.sessionLabel);
    CUSTOM[key]=obj; PACKS[key]=obj;
    try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(CUSTOM)); }catch(e){}
    FS.msg={ok:true,text:"Saved! “"+obj.sessionLabel+"” is now in the topic selector."}; FS.paste="";
    render(); },
  removeTopic(k){ delete CUSTOM[k]; delete PACKS[k];
    if(S.pack===k) S.pack="penmen";
    try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(CUSTOM)); }catch(e){} save(); render(); }
};
window.App=App;
if(!REQUIRE_WORDS) S.unlockedUpTo=PHASE_META.length-1;
render();
</script>
